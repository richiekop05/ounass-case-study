[project]
name = "ounass-scraper"
version = "0.1.0"
description = "One-off sample collector for the Ounass case study (about 250 products)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "typer>=0.12",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "anthropic>=2.8.0",
    "jsonschema>=4.26.0",
    "tomlkit>=0.15.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scraper = "scraper.cli:app"
catalog = "catalog.cli:app"
tagger = "tagger.cli:app"
richies = "richies.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper", "src/catalog", "src/tagger", "src/app", "store/richies"]

[tool.pytest.ini_options]
testpaths = ["tests", "store/tests"]
pythonpath = ["src", "store"]
